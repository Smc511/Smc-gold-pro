name: Build SMC Gold Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Verifier les fichiers
        run: |
          test -f index.html
          test -f manifest.json
